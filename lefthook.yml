pre-commit:
  parallel: true
  commands:
    fmt:
      run: golangci-lint fmt ./...
    lint:
      run: golangci-lint run ./...
    build:
      run: go build ./...

pre-push:
  parallel: true
  commands:
    lint:
      run: golangci-lint run ./...
    test:
      run: go test -race -cover ./...
