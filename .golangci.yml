version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - errorlint
    - bodyclose
    - prealloc
    - unconvert
    - gocritic
    - revive
  settings:
    govet:
      enable:
        - shadow
    gosec:
      excludes:
        - G306
        - G703
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: exported
          disabled: true
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/index-null/cmus-lyric
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
